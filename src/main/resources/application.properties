# O arquivo .env da raiz do backend (ao lado do pom.xml) é lido por
# config/DatabaseUrlEnvironmentPostProcessor. Em produção (Render) as variáveis vêm do painel.

# ─── BANCO DE DADOS (Neon) ────────────────────────────────────────
# DATABASE_URL aceita os dois formatos:
#   - o que o Neon mostra:  postgresql://usuario:senha@ep-xxx.neon.tech/neondb?sslmode=require
#   - formato JDBC:         jdbc:postgresql://ep-xxx.neon.tech/neondb?sslmode=require
#     (nesse caso informe também DATABASE_USERNAME e DATABASE_PASSWORD)
# A conversão é feita por config/DatabaseUrlEnvironmentPostProcessor.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000

# ─── ESTRUTURA DO BANCO ───────────────────────────────────────────
# As tabelas são criadas por src/main/resources/schema.sql na inicialização.
# O Hibernate só confere se as entidades batem com o banco (não altera nada).
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ─── E-MAIL (opcional) ────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

# ─── STUDIO ───────────────────────────────────────────────────────
studio.nome=${STUDIO_NOME:Studio Elen Gomes}
studio.email.remetente=${MAIL_USERNAME:}
studio.whatsapp=${STUDIO_WHATSAPP:5511983384655}
studio.horario.abertura=${STUDIO_ABERTURA:09:00}
studio.horario.fechamento=${STUDIO_FECHAMENTO:19:00}

# ─── LOGIN DA API ─────────────────────────────────────────────────
app.admin.user=${ADMIN_USER:elen}
app.admin.password=${ADMIN_PASSWORD:admin123}
security.jwt.secret=${JWT_SECRET:troque-esta-chave-em-producao-studio-elen-gomes}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:43200}
# Endereço(s) do frontend, separados por vírgula. Aceita curinga: https://*.vercel.app
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ─── SERVIDOR ─────────────────────────────────────────────────────
server.port=${PORT:8080}
spring.jackson.serialization.write-dates-as-timestamps=false
