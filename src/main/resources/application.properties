spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.idle-timeout=60000

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

studio.nome=${STUDIO_NOME:Studio Elen Gomes}
studio.email.remetente=${MAIL_USERNAME:}
studio.whatsapp=${STUDIO_WHATSAPP:5511983384655}
studio.horario.abertura=${STUDIO_ABERTURA:09:00}
studio.horario.fechamento=${STUDIO_FECHAMENTO:19:00}

app.admin.user=${ADMIN_USER:elen}
app.admin.password=${ADMIN_PASSWORD:admin123}
security.jwt.secret=${JWT_SECRET:troque-esta-chave-em-producao-studio-elen-gomes}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:43200}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

server.port=${PORT:8080}
spring.jackson.serialization.write-dates-as-timestamps=false
